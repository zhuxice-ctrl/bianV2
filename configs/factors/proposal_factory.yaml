mode: proposal_only
seed: 7
max_candidates: 20
max_proposals_per_family: 4
max_review_queue: 20
max_rounds: 4
max_tree_depth: 3
forbidden_archive_path: configs/factors/forbidden_factors.yaml
preregistration:
  q_nominal: 0.2
  holding_bars: 4
  cost_assumption: declare_before_development
  development_sample_definition: declare_before_development
  evaluation_horizon: 4_bars
  falsification_criteria: declare_before_development
base_factors:
  - price.momentum
  - price.reversal
  - price.realized_volatility
  - volume.surprise
  - volume.amihud
  - derivatives.funding_zscore
  - derivatives.oi_change
windows: [6, 12, 24, 48, 168]
allowed_columns: [close, open, high, low, volume, funding_rate, open_interest]
# 注意：allowed_unary / allowed_binary 仅约束语法采样路径（seeded_grammar）。
# 注册模板（registered_template）使用 primitives.py 中的固定算子集，不受这两项约束；
# 当模板数量占满 max_candidates 名额时，语法采样不会产生提案，本两项实际不生效。
allowed_unary: [lag, delta, zscore, rolling_rank]
allowed_binary: [add, subtract, multiply, safe_ratio]
