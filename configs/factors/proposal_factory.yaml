mode: proposal_only
seed: 7
max_candidates: 20
max_proposals_per_family: 4
max_review_queue: 5
max_rounds: 4
max_tree_depth: 3
forbidden_archive_path: configs/factors/forbidden_factors.yaml
base_factors:
  - price.momentum
  - price.reversal
  - price.realized_volatility
  - volume.surprise
  - volume.amihud
  - derivatives.funding_zscore
  - derivatives.oi_change
windows: [6, 12, 24, 48, 168]
allowed_columns: [close, open, high, low, volume, funding_rate, open_interest]
allowed_unary: [lag, delta, zscore, rolling_rank]
allowed_binary: [add, subtract, multiply, safe_ratio]
