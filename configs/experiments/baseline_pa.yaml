# Baseline PA experiment manifest
# This config drives the legacy PA strategy through the new validation pipeline.
# Thresholds are design constants — do NOT tune them using PA results.

experiment:
  name: "baseline_pa"
  description: "Legacy Price Action Confluence strategy evaluated through the unified pipeline"

assets:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT

interval: "4h"

walk_forward:
  initial_train_size: 1095
  test_size: 182
  step: 182
  horizon: "4h"
  label_horizon: 1
  embargo: 6

locked_holdout:
  size: 365

seed: 42

costs:
  normal:
    taker_fee_bps: 4.0
    slippage_bps: 5.0
  stress:
    taker_fee_bps: 8.0
    slippage_bps: 10.0

position_sizing:
  gross_limit: 1.0

promotion_thresholds:
  min_positive_fold_ratio: 0.70
  min_median_sharpe: 0.80
  min_sharpe_ci_lower: 0.0
  min_normal_max_drawdown: -0.15
  min_stress_drawdown: -0.25

# Diagnostics are computed from run evidence. They must never be predeclared true here.
