[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bian-quant"
version = "0.1.0"
description = "Reproducible crypto quantitative research platform"
requires-python = ">=3.11,<3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "polars>=1.30,<2",
  "pyarrow>=20,<21",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "scipy>=1.15,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.116,<1", "jinja2>=3.1,<4", "plotly>=6,<7", "uvicorn>=0.35,<1"]
ml = ["lightgbm>=4.6,<5", "scikit-learn>=1.7,<2"]
models = ["einops>=0.8,<1", "huggingface-hub>=0.33,<1", "safetensors>=0.6,<1", "torch>=2.7,<3", "tqdm>=4.67,<5"]
dev = ["hypothesis>=6.135,<7", "mypy>=1.16,<2", "pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[project.scripts]
bian-quant = "bian_quant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bian_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires optional model dependencies or weights", "network: requires network access"]
addopts = "-p no:cov"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "dashboard", "artifacts"]
exclude = [
  "backtest",
  "strategies",
  "dashboard",
  "data_collector.py",
  "run_backtest.py",
  "screenshot.py",
  "scripts/verify_log_view.py",
  "scripts/verify_log_view.js",
  "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bian_quant"]
